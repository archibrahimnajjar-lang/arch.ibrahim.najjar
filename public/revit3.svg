<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <rect width="1600" height="1000" fill="#0C131D"/>
  <!-- Blueprint Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#16263B" stroke-width="0.8"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#00C0FF" stroke-width="1" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  
  <!-- Outer Title Block Frame -->
  <rect x="40" y="40" width="1520" height="920" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.85"/>
  <rect x="50" y="50" width="1500" height="900" fill="none" stroke="#0099FF" stroke-width="1" opacity="0.5"/>
  
  <!-- Left Side: Detailed Floor Plan -->
  <g transform="translate(100, 120)">
    <!-- Dimension lines -->
    <line x1="-30" y1="40" x2="-30" y2="600" stroke="#00E5FF" stroke-width="1.2" opacity="0.7"/>
    <circle cx="-30" cy="40" r="3" fill="#00E5FF"/>
    <circle cx="-30" cy="600" r="3" fill="#00E5FF"/>
    <text x="-40" y="330" fill="#00E5FF" font-family="monospace" font-size="16" text-anchor="middle" transform="rotate(-90 -40 330)">DIMENSION: 18,400 mm</text>
    
    <line x1="40" y1="-30" x2="680" y2="-30" stroke="#00E5FF" stroke-width="1.2" opacity="0.7"/>
    <circle cx="40" cy="-30" r="3" fill="#00E5FF"/>
    <circle cx="680" cy="-30" r="3" fill="#00E5FF"/>
    <text x="360" y="-40" fill="#00E5FF" font-family="monospace" font-size="16" text-anchor="middle">GRID SPAN: 22,500 mm</text>

    <!-- Wall Outlines -->
    <rect x="40" y="40" width="640" height="560" fill="#101C2B" stroke="#00D2FF" stroke-width="2.5"/>
    <rect x="60" y="60" width="600" height="520" fill="none" stroke="#0099DD" stroke-width="1.5"/>
    
    <!-- Interior Rooms & Partitions -->
    <line x1="280" y1="60" x2="280" y2="580" stroke="#00D2FF" stroke-width="2"/>
    <line x1="280" y1="320" x2="660" y2="320" stroke="#00D2FF" stroke-width="2"/>
    <line x1="60" y1="260" x2="280" y2="260" stroke="#00D2FF" stroke-width="2"/>
    
    <!-- Hatched Core Wall -->
    <rect x="290" y="330" width="70" height="240" fill="url(#hatch)" stroke="#00E5FF" stroke-width="1.2"/>
    
    <!-- Stairs Symbol -->
    <g transform="translate(100, 300)">
      <rect x="0" y="0" width="140" height="240" fill="#132338" stroke="#00D2FF" stroke-width="1.2"/>
      <line x1="0" y1="20" x2="140" y2="20" stroke="#00A2ED" stroke-width="1"/>
      <line x1="0" y1="40" x2="140" y2="40" stroke="#00A2ED" stroke-width="1"/>
      <line x1="0" y1="60" x2="140" y2="60" stroke="#00A2ED" stroke-width="1"/>
      <line x1="0" y1="80" x2="140" y2="80" stroke="#00A2ED" stroke-width="1"/>
      <line x1="0" y1="100" x2="140" y2="100" stroke="#00A2ED" stroke-width="1"/>
      <line x1="0" y1="120" x2="140" y2="120" stroke="#00A2ED" stroke-width="1"/>
      <line x1="0" y1="140" x2="140" y2="140" stroke="#00A2ED" stroke-width="1"/>
      <line x1="0" y1="160" x2="140" y2="160" stroke="#00A2ED" stroke-width="1"/>
      <line x1="0" y1="180" x2="140" y2="180" stroke="#00A2ED" stroke-width="1"/>
      <line x1="0" y1="200" x2="140" y2="200" stroke="#00A2ED" stroke-width="1"/>
      <line x1="0" y1="220" x2="140" y2="220" stroke="#00A2ED" stroke-width="1"/>
      <path d="M 70 230 L 70 30 L 80 45 M 70 30 L 60 45" stroke="#00FFAA" stroke-width="2" fill="none"/>
      <text x="70" y="235" fill="#00FFAA" font-family="monospace" font-size="12" text-anchor="middle">UP</text>
    </g>

    <!-- Room Labels -->
    <text x="170" y="160" fill="#F0F6FC" font-family="monospace" font-size="16" font-weight="700">LIVING SALON</text>
    <text x="170" y="185" fill="#7D8590" font-family="monospace" font-size="12">FL: +0.45 m · TILES</text>

    <text x="470" y="180" fill="#F0F6FC" font-family="monospace" font-size="16" font-weight="700">MASTER SUITE</text>
    <text x="470" y="205" fill="#7D8590" font-family="monospace" font-size="12">FL: +0.45 m · PARQUET</text>

    <text x="510" y="460" fill="#F0F6FC" font-family="monospace" font-size="16" font-weight="700">KITCHEN &amp; DINING</text>
    <text x="510" y="485" fill="#7D8590" font-family="monospace" font-size="12">WATERPROOF TILES</text>
    
    <text x="360" y="650" fill="#00D2FF" font-family="monospace" font-size="18" font-weight="700" text-anchor="middle">GROUND FLOOR ARCHITECTURAL PLAN · SCALE 1:50</text>
  </g>

  <!-- Right Side: Wall Section Detailing & Foundation Layers -->
  <g transform="translate(880, 120)">
    <!-- Section Border -->
    <rect x="0" y="40" width="600" height="560" fill="#101A26" stroke="#00A3FF" stroke-width="1.8"/>
    
    <!-- Foundation Slab & Footing -->
    <rect x="60" y="480" width="480" height="80" fill="url(#hatch)" stroke="#00E5FF" stroke-width="1.8"/>
    <text x="300" y="525" fill="#00E5FF" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">REINFORCED CONCRETE FOOTING · 350mm</text>

    <!-- Cavity Wall with Insulation Layers -->
    <rect x="140" y="80" width="120" height="400" fill="#142334" stroke="#00D2FF" stroke-width="2"/>
    <line x1="170" y1="80" x2="170" y2="480" stroke="#FFB703" stroke-width="2.5" stroke-dasharray="4 4"/>
    <text x="175" y="130" fill="#FFB703" font-family="monospace" font-size="11" transform="rotate(90 175 130)">THERMAL INSULATION · 50mm EPS</text>
    <line x1="210" y1="80" x2="210" y2="480" stroke="#00D2FF" stroke-width="1.5"/>

    <!-- Parapet & Roof Slab Detail -->
    <rect x="140" y="60" width="360" height="40" fill="#1D334D" stroke="#00D2FF" stroke-width="1.5"/>
    <line x1="140" y1="75" x2="500" y2="75" stroke="#00FFAA" stroke-width="1.5"/>
    
    <!-- Callout Leader Notes -->
    <g stroke="#00E5FF" stroke-width="1" fill="none">
      <path d="M 230 70 L 320 30 L 420 30"/>
      <path d="M 210 240 L 320 200 L 460 200"/>
      <path d="M 230 460 L 340 430 L 480 430"/>
    </g>
    <circle cx="230" cy="70" r="3" fill="#00E5FF"/>
    <circle cx="210" cy="240" r="3" fill="#00E5FF"/>
    <circle cx="230" cy="460" r="3" fill="#00E5FF"/>

    <text x="430" y="26" fill="#00E5FF" font-family="monospace" font-size="12">ROOF PARAPET &amp; WATERPROOF MEMBRANE</text>
    <text x="470" y="196" fill="#00E5FF" font-family="monospace" font-size="12">EXTERIOR CLADDING &amp; AIR CAVITY</text>
    <text x="490" y="426" fill="#00E5FF" font-family="monospace" font-size="12">DAMP-PROOF COURSE (DPC) LEVEL</text>

    <!-- Detail Dimensions -->
    <line x1="100" y1="80" x2="100" y2="480" stroke="#00FFAA" stroke-width="1.2"/>
    <text x="85" y="280" fill="#00FFAA" font-family="monospace" font-size="14" text-anchor="middle" transform="rotate(-90 85 280)">CLEAR HEIGHT: 3,200 mm</text>
    
    <text x="300" y="650" fill="#00D2FF" font-family="monospace" font-size="18" font-weight="700" text-anchor="middle">TYPICAL WALL &amp; SLAB SECTION · SCALE 1:20</text>
  </g>

  <!-- Bottom Title Block Sheet -->
  <g transform="translate(60, 830)">
    <rect x="0" y="0" width="1480" height="90" fill="#0B131E" stroke="#00D2FF" stroke-width="1.5"/>
    <line x1="420" y1="0" x2="420" y2="90" stroke="#1E334D" stroke-width="1.5"/>
    <line x1="900" y1="0" x2="900" y2="90" stroke="#1E334D" stroke-width="1.5"/>
    <line x1="1200" y1="0" x2="1200" y2="90" stroke="#1E334D" stroke-width="1.5"/>

    <text x="30" y="38" fill="#7D8590" font-family="monospace" font-size="12">PROJECT / DISCIPLINE:</text>
    <text x="30" y="66" fill="#F0F6FC" font-family="monospace" font-size="18" font-weight="700">MODERN VILLA TECHNICAL DETAILING &amp; WORKING DRAWINGS</text>

    <text x="450" y="38" fill="#7D8590" font-family="monospace" font-size="12">SOFTWARE &amp; BIM STANDARDS:</text>
    <text x="450" y="66" fill="#00E5FF" font-family="monospace" font-size="18" font-weight="700">AUTODESK REVIT ARCHITECTURE · EXECUTIVE BIM</text>

    <text x="930" y="38" fill="#7D8590" font-family="monospace" font-size="12">INSTRUCTOR / STUDIO:</text>
    <text x="930" y="66" fill="#F0F6FC" font-family="monospace" font-size="18" font-weight="700">ARCH. IBRAHIM AL-NAJJAR</text>

    <text x="1230" y="38" fill="#7D8590" font-family="monospace" font-size="12">SHEET NO:</text>
    <text x="1230" y="66" fill="#00FFAA" font-family="monospace" font-size="20" font-weight="700">A-102 (REV. 03)</text>
  </g>
</svg>